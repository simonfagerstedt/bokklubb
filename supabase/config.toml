# Supabase CLI project config.
# Run `supabase login` then `supabase link --project-ref YOUR-PROJECT-REF`
# from the project root to connect this to your hosted project, then
# `supabase db push` to apply migrations/ to it.
# See SETUP.md for the full walkthrough.

project_id = "bokklubb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
